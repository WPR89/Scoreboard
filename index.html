<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivalry - Dynamic Scoreboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            cyan: '#00f3ff',
                            pink: '#ff0055',
                            purple: '#b000ff',
                            yellow: '#ffcc00',
                            green: '#00ff66'
                        },
                        dark: {
                            bg: '#0a0a0f',
                            card: '#12121e',
                            border: '#1f1f35',
                            hover: '#1a1a2e'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Glowing & Animations */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0f;
            color: #f3f4f6;
            touch-action: manipulation;
        }
        .glow-cyan {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.35);
        }
        .glow-pink {
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.35);
        }
        .glow-yellow {
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }
        .border-glow-cyan {
            border-color: rgba(0, 243, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .text-glow-pink {
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
        }
        .text-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-podium {
            animation: pulse-ring 3s infinite ease-in-out;
        }

        /* Toast Popup Animation */
        @keyframes slideUp {
            from { transform: translateY(100%) translateX(-50%); opacity: 0; }
            to { transform: translateY(0) translateX(-50%); opacity: 1; }
        }
        .animate-toast {
            animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-10 selection:bg-neon-pink selection:text-white">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-dark-bg/80 backdrop-blur-md border-b border-dark-border">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-neon-pink to-neon-purple flex items-center justify-center glow-pink">
                    <i data-lucide="swords" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl tracking-wider text-white flex items-center gap-2">
                        RIVALRY <span class="text-xs px-2 py-0.5 rounded-full bg-neon-pink/20 text-neon-pink border border-neon-pink/30 font-semibold tracking-normal">HQ</span>
                    </h1>
                    <p class="text-xs text-gray-400">Live Social Leaderboard</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openModal('addPlayerModal')" class="flex items-center gap-1.5 bg-neon-cyan/10 hover:bg-neon-cyan/20 text-neon-cyan border border-neon-cyan/40 px-3 py-2 rounded-xl text-xs font-bold transition-all active:scale-95">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Add Rival</span>
                </button>
                <button onclick="openModal('logMatchModal')" class="flex items-center gap-1.5 bg-gradient-to-r from-neon-pink to-neon-purple hover:opacity-90 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition-all shadow-lg glow-pink active:scale-95">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    <span>Log Match</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-8">

        <!-- Top 3 Podium Section -->
        <section id="podiumSection" class="hidden">
            <div class="flex items-end justify-center gap-2 sm:gap-4 pt-6 pb-2">
                <!-- Rank 2 -->
                <div id="podium2" class="w-1/3 max-w-[150px] flex flex-col items-center">
                    <!-- Populated dynamically -->
                </div>
                <!-- Rank 1 -->
                <div id="podium1" class="w-1/3 max-w-[170px] flex flex-col items-center -translate-y-4">
                    <!-- Populated dynamically -->
                </div>
                <!-- Rank 3 -->
                <div id="podium3" class="w-1/3 max-w-[150px] flex flex-col items-center">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

        <!-- Dynamic Leaderboard Table/Cards -->
        <section class="bg-dark-card border border-dark-border rounded-2xl overflow-hidden shadow-2xl">
            <!-- Header Controls -->
            <div class="p-4 sm:p-5 border-b border-dark-border flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-dark-bg/40">
                <div class="flex items-center gap-2">
                    <i data-lucide="trophy" class="w-5 h-5 text-neon-yellow"></i>
                    <h2 class="text-lg font-bold text-white tracking-wide">Rankings Table</h2>
                    <span id="playerCountBadge" class="text-xs bg-dark-border px-2 py-0.5 rounded-full text-gray-400 font-mono">0 Rivals</span>
                </div>
                
                <div class="flex items-center gap-2 text-xs">
                    <!-- Search Input -->
                    <div class="relative flex-1 sm:w-48">
                        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" oninput="render()" placeholder="Search rival..." class="w-full bg-dark-bg border border-dark-border rounded-xl pl-8 pr-3 py-1.5 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-neon-cyan transition-colors">
                    </div>
                    <!-- Sort Selection -->
                    <select id="sortBy" onchange="render()" class="bg-dark-bg border border-dark-border rounded-xl px-2.5 py-1.5 text-gray-300 focus:outline-none focus:border-neon-cyan">
                        <option value="score">Sort by Score</option>
                        <option value="wins">Sort by Wins</option>
                        <option value="name">Sort by Name</option>
                    </select>
                </div>
            </div>

            <!-- Roster List -->
            <div id="leaderboardList" class="divide-y divide-dark-border/60">
                <!-- Populated dynamically -->
            </div>
        </section>

        <!-- Activity & Event Feed -->
        <section class="bg-dark-card border border-dark-border rounded-2xl p-4 sm:p-5 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="history" class="w-5 h-5 text-neon-cyan"></i>
                    <h3 class="font-bold text-white text-base">Rivalry Feed</h3>
                </div>
                <span class="text-xs text-gray-400">Recent match logs & updates</span>
            </div>
            
            <div id="activityFeed" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                <!-- Activity Feed Items -->
            </div>
        </section>
    </main>

    <!-- Floating Action Button for Mobile -->
    <div class="fixed bottom-5 right-5 z-30 sm:hidden flex flex-col gap-3">
        <button onclick="openModal('logMatchModal')" class="w-14 h-14 bg-gradient-to-tr from-neon-pink to-neon-purple rounded-full flex items-center justify-center text-white shadow-xl glow-pink active:scale-95 transition-transform">
            <i data-lucide="zap" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- MODAL 1: ADD NEW PLAYER -->
    <div id="addPlayerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card border border-dark-border rounded-2xl w-full max-w-md p-6 shadow-2xl relative animate-toast">
            <button onclick="closeModal('addPlayerModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="flex items-center gap-3 mb-5">
                <div class="w-10 h-10 rounded-xl bg-neon-cyan/20 border border-neon-cyan/40 flex items-center justify-center text-neon-cyan">
                    <i data-lucide="user-plus" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">Add New Competitor</h3>
                    <p class="text-xs text-gray-400">Enter player details into the active rivalry roster.</p>
                </div>
            </div>

            <form id="addPlayerForm" onsubmit="handleAddPlayer(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Rival Name / Gamer Tag</label>
                    <input type="text" id="playerNameInput" required placeholder="e.g. ApexPredator, Sarah, Alex" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-neon-cyan transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Avatar / Character Emoji</label>
                    <div class="grid grid-cols-6 gap-2 text-center" id="emojiPicker">
                        <!-- Emoji choices generated dynamically -->
                    </div>
                    <input type="hidden" id="selectedEmoji" value="⚔️">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Starting Score (Optional)</label>
                    <input type="number" id="playerScoreInput" value="0" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-neon-cyan transition-colors">
                </div>

                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" onclick="closeModal('addPlayerModal')" class="px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white bg-dark-bg border border-dark-border">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-neon-cyan/20 border border-neon-cyan/60 text-neon-cyan hover:bg-neon-cyan/30 transition-all">Add Rival</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: LOG MATCH / SCORE EVENT -->
    <div id="logMatchModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-dark-card border border-dark-border rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeModal('logMatchModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="flex items-center gap-3 mb-5">
                <div class="w-10 h-10 rounded-xl bg-neon-pink/20 border border-neon-pink/40 flex items-center justify-center text-neon-pink">
                    <i data-lucide="swords" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">Log Rivalry Event</h3>
                    <p class="text-xs text-gray-400">Record match results and update rankings.</p>
                </div>
            </div>

            <form id="logMatchForm" onsubmit="handleLogMatch(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Winner (+ Points)</label>
                    <select id="winnerSelect" required class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-neon-pink">
                        <!-- Options generated -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Loser (Optional)</label>
                    <select id="loserSelect" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-neon-pink">
                        <option value="">-- None / Solo Event --</option>
                        <!-- Options generated -->
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Points Awarded</label>
                        <input type="number" id="pointsAwarded" value="10" min="1" required class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-neon-pink">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Game / Event Title</label>
                        <input type="text" id="gameTitle" placeholder="e.g. FIFA, Chess, Darts" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-neon-pink">
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" onclick="closeModal('logMatchModal')" class="px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white bg-dark-bg border border-dark-border">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-neon-pink to-neon-purple hover:opacity-90 shadow-md glow-pink transition-all">Submit Result</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2"></div>

    <!-- App Logic Script -->
    <script>
        // Pre-defined initial sample players for instant preview
        let players = [
            { id: '1', name: 'CyberSam', score: 140, avatar: '🤖', wins: 14, losses: 2, streak: 3 },
            { id: '2', name: 'Valkyrie', score: 115, avatar: '⚡', wins: 11, losses: 4, streak: 2 },
            { id: '3', name: 'ShadowKnight', score: 95, avatar: '🥷', wins: 9, losses: 5, streak: 0 },
            { id: '4', name: 'Blaze', score: 70, avatar: '🔥', wins: 7, losses: 6, streak: 1 },
            { id: '5', name: 'PixelPro', score: 45, avatar: '🎮', wins: 4, losses: 8, streak: 0 }
        ];

        let activities = [
            { id: 'a1', text: '<strong>CyberSam</strong> defeated <strong>ShadowKnight</strong> in Smash Bros (+10 pts)', time: '10m ago' },
            { id: 'a2', text: '<strong>Valkyrie</strong> won a match (+15 pts)', time: '1h ago' }
        ];

        const EMOJIS = ['⚔️', '🤖', '⚡', '🥷', '🔥', '🎮', '👑', '🐉', '🦁', '💀', '🎯', '🚀'];

        // Initial setup
        window.onload = function() {
            renderEmojiPicker();
            render();
            lucide.createIcons();
        };

        // Render functions
        function render() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortBy').value;

            // Sort logic
            let sortedPlayers = [...players];
            if (sortBy === 'score') {
                sortedPlayers.sort((a, b) => b.score - a.score);
            } else if (sortBy === 'wins') {
                sortedPlayers.sort((a, b) => b.wins - a.wins);
            } else if (sortBy === 'name') {
                sortedPlayers.sort((a, b) => a.name.localeCompare(b.name));
            }

            // Filter logic
            const filtered = sortedPlayers.filter(p => p.name.toLowerCase().includes(searchQuery));

            // Update player count badge
            document.getElementById('playerCountBadge').innerText = `${players.length} Rival${players.length === 1 ? '' : 's'}`;

            // Render Podium (if at least 3 players exist and no filter active)
            const podiumSec = document.getElementById('podiumSection');
            if (sortedPlayers.length >= 3 && !searchQuery) {
                podiumSec.classList.remove('hidden');
                renderPodium(sortedPlayers.slice(0, 3));
            } else {
                podiumSec.classList.add('hidden');
            }

            // Render List
            const listContainer = document.getElementById('leaderboardList');
            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-gray-500">
                        <i data-lucide="user-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm">No rivals found. Add some to start the competition!</p>
                    </div>
                `;
            } else {
                listContainer.innerHTML = filtered.map((player, index) => {
                    // Find global rank index
                    const rank = sortedPlayers.findIndex(p => p.id === player.id) + 1;
                    return renderPlayerRow(player, rank);
                }).join('');
            }

            // Update Select dropdowns for Log Match modal
            updateSelectOptions();

            // Render Activity Feed
            renderActivityFeed();

            // Refresh icons after dynamic DOM insertions
            lucide.createIcons();
        }

        function renderPodium(top3) {
            const first = top3[0];
            const second = top3[1];
            const third = top3[2];

            document.getElementById('podium1').innerHTML = `
                <div class="relative mb-2">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-dark-card border-2 border-neon-yellow flex items-center justify-center text-3xl sm:text-4xl shadow-xl glow-yellow">
                        ${first.avatar}
                    </div>
                    <span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-neon-yellow text-black text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider flex items-center gap-1 shadow">
                        <i data-lucide="crown" class="w-3 h-3 fill-black"></i> 1ST
                    </span>
                </div>
                <div class="bg-gradient-to-t from-dark-card to-dark-hover border-t-2 border-neon-yellow w-full pt-3 pb-4 px-2 rounded-t-xl text-center shadow-lg">
                    <div class="font-bold text-white text-sm sm:text-base truncate">${first.name}</div>
                    <div class="font-mono font-extrabold text-neon-yellow text-lg sm:text-xl">${first.score} <span class="text-[10px] text-gray-400 font-normal">pts</span></div>
                </div>
            `;

            document.getElementById('podium2').innerHTML = `
                <div class="relative mb-2">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-dark-card border-2 border-gray-300 flex items-center justify-center text-2xl sm:text-3xl shadow-md">
                        ${second.avatar}
                    </div>
                    <span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-gray-300 text-black text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">2ND</span>
                </div>
                <div class="bg-gradient-to-t from-dark-card to-dark-hover border-t-2 border-gray-300 w-full pt-3 pb-3 px-2 rounded-t-xl text-center">
                    <div class="font-bold text-gray-200 text-xs sm:text-sm truncate">${second.name}</div>
                    <div class="font-mono font-bold text-gray-300 text-base sm:text-lg">${second.score} <span class="text-[10px] text-gray-400 font-normal">pts</span></div>
                </div>
            `;

            document.getElementById('podium3').innerHTML = `
                <div class="relative mb-2">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-dark-card border-2 border-amber-600 flex items-center justify-center text-2xl sm:text-3xl shadow-md">
                        ${third.avatar}
                    </div>
                    <span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-amber-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">3RD</span>
                </div>
                <div class="bg-gradient-to-t from-dark-card to-dark-hover border-t-2 border-amber-600 w-full pt-3 pb-3 px-2 rounded-t-xl text-center">
                    <div class="font-bold text-gray-200 text-xs sm:text-sm truncate">${third.name}</div>
                    <div class="font-mono font-bold text-amber-500 text-base sm:text-lg">${third.score} <span class="text-[10px] text-gray-400 font-normal">pts</span></div>
                </div>
            `;
        }

        function renderPlayerRow(player, rank) {
            let rankBadgeClass = "bg-dark-border text-gray-400";
            if (rank === 1) rankBadgeClass = "bg-neon-yellow text-black font-extrabold";
            else if (rank === 2) rankBadgeClass = "bg-gray-300 text-black font-bold";
            else if (rank === 3) rankBadgeClass = "bg-amber-600 text-white font-bold";

            const streakBadge = player.streak > 1 
                ? `<span class="inline-flex items-center gap-1 text-[10px] bg-neon-pink/20 text-neon-pink border border-neon-pink/40 px-2 py-0.5 rounded-full font-bold"><i data-lucide="flame" class="w-3 h-3"></i> ${player.streak} W Streak</span>`
                : '';

            return `
                <div class="p-3.5 sm:p-4 flex items-center justify-between hover:bg-dark-hover/50 transition-colors group">
                    <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                        <!-- Rank -->
                        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl flex items-center justify-center text-xs sm:text-sm shrink-0 ${rankBadgeClass}">
                            #${rank}
                        </div>

                        <!-- Avatar -->
                        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-dark-bg border border-dark-border flex items-center justify-center text-xl sm:text-2xl shrink-0 group-hover:border-neon-cyan/50 transition-colors">
                            ${player.avatar}
                        </div>

                        <!-- Info -->
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-white text-sm sm:text-base truncate">${escapeHtml(player.name)}</h4>
                                ${streakBadge}
                            </div>
                            <div class="text-xs text-gray-400 flex items-center gap-3 mt-0.5">
                                <span>W: <strong class="text-gray-200">${player.wins}</strong></span>
                                <span>L: <strong class="text-gray-200">${player.losses}</strong></span>
                            </div>
                        </div>
                    </div>

                    <!-- Score & Quick Actions -->
                    <div class="flex items-center gap-3 shrink-0">
                        <div class="text-right">
                            <div class="font-mono font-extrabold text-white text-lg sm:text-xl tracking-tight text-glow-cyan">${player.score}</div>
                            <div class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider">Points</div>
                        </div>

                        <!-- Quick Increment / Decrement Buttons -->
                        <div class="flex flex-col sm:flex-row gap-1">
                            <button onclick="updateScore('${player.id}', 1)" title="Add 1 Point" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center transition-all active:scale-90">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                            <button onclick="updateScore('${player.id}', -1)" title="Subtract 1 Point" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center transition-all active:scale-90">
                                <i data-lucide="minus" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deletePlayer('${player.id}')" title="Remove Player" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-dark-bg hover:bg-rose-900/30 text-gray-500 hover:text-rose-400 border border-dark-border flex items-center justify-center transition-all">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderActivityFeed() {
            const container = document.getElementById('activityFeed');
            if (activities.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-2">No activity recorded yet.</p>`;
                return;
            }

            container.innerHTML = activities.map(act => `
                <div class="text-xs text-gray-300 bg-dark-bg/60 border border-dark-border/80 rounded-xl p-2.5 flex items-center justify-between">
                    <div>${act.text}</div>
                    <span class="text-[10px] text-gray-500 ml-2 shrink-0">${act.time}</span>
                </div>
            `).join('');
        }

        function renderEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.innerHTML = EMOJIS.map((e, idx) => `
                <button type="button" onclick="selectEmoji('${e}', this)" class="emoji-btn text-xl p-2 rounded-xl border border-dark-border bg-dark-bg hover:border-neon-cyan transition-all ${idx === 0 ? 'border-neon-cyan bg-neon-cyan/10' : ''}">
                    ${e}
                </button>
            `).join('');
        }

        function selectEmoji(emoji, btnEl) {
            document.getElementById('selectedEmoji').value = emoji;
            document.querySelectorAll('.emoji-btn').forEach(b => {
                b.classList.remove('border-neon-cyan', 'bg-neon-cyan/10');
            });
            btnEl.classList.add('border-neon-cyan', 'bg-neon-cyan/10');
        }

        // Logic Actions
        function updateScore(playerId, amount) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            player.score += amount;
            showToast(`${player.name}'s score ${amount >= 0 ? '+' + amount : amount}`);
            
            // Add activity log entry
            activities.unshift({
                id: 'act-' + Date.now(),
                text: `Quick adjustment: <strong>${escapeHtml(player.name)}</strong> score set to ${player.score} pts`,
                time: 'Just now'
            });

            render();
        }

        function handleAddPlayer(event) {
            event.preventDefault();
            const nameInput = document.getElementById('playerNameInput');
            const scoreInput = document.getElementById('playerScoreInput');
            const avatarInput = document.getElementById('selectedEmoji');

            const newPlayer = {
                id: 'p-' + Date.now(),
                name: nameInput.value.trim(),
                score: parseInt(scoreInput.value) || 0,
                avatar: avatarInput.value || '⚔️',
                wins: 0,
                losses: 0,
                streak: 0
            };

            players.push(newPlayer);
            showToast(`Added ${newPlayer.name} to the roster!`);
            
            // Reset form & close modal
            nameInput.value = '';
            scoreInput.value = '0';
            closeModal('addPlayerModal');

            render();
        }

        function handleLogMatch(event) {
            event.preventDefault();
            const winnerId = document.getElementById('winnerSelect').value;
            const loserId = document.getElementById('loserSelect').value;
            const points = parseInt(document.getElementById('pointsAwarded').value) || 10;
            const title = document.getElementById('gameTitle').value.trim();

            const winner = players.find(p => p.id === winnerId);
            const loser = players.find(p => p.id === loserId);

            if (!winner) return;

            // Apply updates
            winner.score += points;
            winner.wins += 1;
            winner.streak += 1;

            let logDesc = `<strong>${escapeHtml(winner.name)}</strong> won ${title ? 'in ' + escapeHtml(title) : 'a match'} (+${points} pts)`;

            if (loser && loser.id !== winner.id) {
                loser.losses += 1;
                loser.streak = 0; // Reset streak on loss
                logDesc = `<strong>${escapeHtml(winner.name)}</strong> defeated <strong>${escapeHtml(loser.name)}</strong> ${title ? 'in ' + escapeHtml(title) : ''} (+${points} pts)`;
            }

            // Log event
            activities.unshift({
                id: 'act-' + Date.now(),
                text: logDesc,
                time: 'Just now'
            });

            showToast(`Match logged successfully!`);
            closeModal('logMatchModal');
            document.getElementById('gameTitle').value = '';

            render();
        }

        function deletePlayer(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            // Custom UI confirmation can be used, standard state deletion here
            players = players.filter(p => p.id !== playerId);
            showToast(`Removed ${player.name} from scoreboard`);
            render();
        }

        function updateSelectOptions() {
            const winnerSelect = document.getElementById('winnerSelect');
            const loserSelect = document.getElementById('loserSelect');

            const optionsHTML = players.map(p => `
                <option value="${p.id}">${p.avatar} ${escapeHtml(p.name)} (${p.score} pts)</option>
            `).join('');

            winnerSelect.innerHTML = optionsHTML || '<option value="">No players available</option>';
            loserSelect.innerHTML = '<option value="">-- None / Solo Event --</option>' + optionsHTML;
        }

        // Modal Controls
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // Toast Feedback System
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'bg-dark-card border border-neon-cyan/50 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 animate-toast glow-cyan';
            toast.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-neon-cyan"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Helper: Escape HTML string safely
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
